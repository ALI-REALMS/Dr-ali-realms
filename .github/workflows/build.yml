name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0
      - name: Build
        run: gradle build --stacktrace || true
      - name: Sources
        run: |
          gradle genSources --stacktrace || true
          mkdir -p dump
          find ~/.gradle -name "*sources*.jar" | grep -i "minecraft\|fabric-rendering\|fabric-api" | head -20 > dump/list.txt
          cat dump/list.txt
          for f in $(cat dump/list.txt); do cp "$f" dump/ || true; done
          find ~/.gradle -name "fabric-rendering-v1*.jar" | head -3 >> dump/list.txt
          for f in $(find ~/.gradle -name "fabric-rendering-v1*.jar" | head -2); do cp "$f" dump/; done
          unzip -l libs/bbs-2.7-1.21.11.jar | grep -i "client/BBSRendering\|FilmEvents\|ShaderProgram" > dump/bbs-classes.txt || true
          for c in mchorse.bbs_mod.client.BBSRendering mchorse.bbs_mod.film.FilmEvents mchorse.bbs_mod.camera.clips.CameraClip; do javap -p -cp libs/bbs-2.7-1.21.11.jar $c > dump/$c.txt 2>&1 || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: dump
      - uses: actions/upload-artifact@v4
        with:
          name: impactfx-mc1.21.11
          path: build/libs/*.jar
