name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0
      - name: Build
        run: gradle build --stacktrace || true
      - name: Print requested sources
        run: |
          gradle genSources --stacktrace 2>&1 | tail -25 || true; find / -name "*sources*.jar" -size +1M 2>/dev/null | head; find ~/.gradle -name "fabric-rendering-v1*" | head
          MS=$(find ~/.gradle -name "minecraft-merged-1.21.11*sources.jar" | head -1)
          FS=$(find ~/.gradle -name "fabric-rendering-v1*sources.jar" | head -1)
          echo "MS=$MS FS=$FS"
          [ -f dump-request.txt ] && while read -r line; do
            [ -z "$line" ] && continue
            echo "########## $line"
            case "$line" in
              bbs:*) javap -p -cp libs/bbs-2.7-1.21.11.jar "${line#bbs:}" ;;
              fapi:*) unzip -p "$FS" "${line#fapi:}" 2>&1 | head -400 ;;
              find:*) (unzip -l "$MS"; unzip -l "$FS") | grep -i "${line#find:}" ;;
              *) unzip -p "$MS" "$line" 2>&1 | head -600 ;;
            esac
          done < dump-request.txt
      - uses: actions/upload-artifact@v4
        with:
          name: impactfx-mc1.21.11
          path: build/libs/*.jar
